<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dceef1" />
    <title>Painel | Espaço Bianca Petenão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/app.css" />
    <link rel="stylesheet" href="src/features/agenda/calendar.css" />
  </head>
  <body class="app-body">
    <div class="app-shell" id="app-shell" hidden>
      <aside class="app-sidebar" id="app-sidebar" aria-label="Navegação principal">
        <a class="sidebar-brand" href="#agenda"
          ><span class="sidebar-brand-kicker">ESPAÇO</span><strong>Bianca Petenão</strong
          ><span class="sidebar-brand-compact" aria-hidden="true">BP</span></a
        >
        <button
          class="sidebar-toggle"
          id="sidebar-toggle"
          type="button"
          aria-controls="app-sidebar"
          aria-expanded="true"
          aria-label="Recolher menu"
        >
          ‹
        </button>
        <nav class="sidebar-navigation" aria-label="Seções do sistema">
          <p class="navigation-label">Menu</p>
          <ul class="navigation-list" id="navigation-list"></ul>
        </nav>
        <button class="logout-link" id="logout" type="button">
          <span class="navigation-icon" aria-hidden="true">↪</span
          ><span class="navigation-link-label">Voltar ao início</span>
        </button>
      </aside>
      <main class="app-main">
        <header class="app-header">
          <div class="app-heading">
            <p class="eyebrow">Espaço Bianca Petenão</p>
            <h1 id="page-title">Agenda</h1>
          </div>
          <div class="profile-summary">
            <div><strong id="profile-name"></strong><span id="profile-role"></span></div>
          </div>
        </header>
        <section class="demo-banner" aria-label="Demonstração">
          <p>
            <strong>Modo demonstração.</strong> Use dados fictícios. As alterações são descartadas
            ao recarregar ou sair.
          </p>
          <label for="demo-role"
            >Perfil da demonstração
            <select id="demo-role">
              <option value="admin">Admin</option>
              <option value="user">Profissional</option>
            </select>
          </label>
        </section>
        <div id="page-content" tabindex="-1"></div>
      </main>
    </div>
    <p id="boot-message" class="boot-message" role="status">Carregando demonstração…</p>
    <noscript>Ative o JavaScript para acessar o sistema.</noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
